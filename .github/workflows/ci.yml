name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build (Native AOT)
        run: dotnet publish src/ClaudeTaskbar.csproj -c Release -o out --nologo
      - name: README pictures render
        run: |
          pip install pillow
          python docs/render.py
      - name: Usage plugin tests
        run: node --test "mod/test/*.test.ts"
      - name: Validate plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .claude-plugin/marketplace.json
          claude plugin validate mod
      - name: Install scripts parse
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'bootstrap.ps1', 'install-lib.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }
